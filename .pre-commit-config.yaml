# Secret scanning before every commit (pip install pre-commit && pre-commit install).
# gitleaks blocks commits containing API keys; `npm run check:secrets` runs an equivalent scan
# without the gitleaks binary (also over the built frontend in dist/).
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: check-secrets
        name: check-secrets (npm run check:secrets)
        entry: npx tsx scripts/check-secrets.ts
        language: system
        pass_filenames: false
